<button class="cmpt-theme-switcher">{#include ./action.html body="Go light"}</button>

{#once <script defer>

const ThemeSwitchers = document.getElementsByClassName("cmpt-theme-switcher");

for (const switcher of ThemeSwitchers) {

    switcher.addEventListener("click", () => {
        const current_theme = document.body.dataset.theme;
        const new_theme = (current_theme === "dark") ? "light" : "dark";

        document.body.dataset.theme = new_theme;
    })
}

</script> }
